name: CI/CD Pipeline - Build & Deploy AI Nutrition Scanner

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build & Test Spring Boot Backend
  # ─────────────────────────────────────────
  build-and-test-backend:
    name: Build and Test Backend (Spring Boot 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Tests
        run: |
          cd backend
          mvn clean package -B -DskipTests

      - name: Upload Backend Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2: Build Next.js Frontend
  # ─────────────────────────────────────────
  build-frontend:
    name: Build Frontend (Next.js 15)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install Dependencies
        working-directory: frontend-web
        run: npm install --legacy-peer-deps

      - name: Build Next.js Web App
        working-directory: frontend-web
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}

  # ─────────────────────────────────────────
  # JOB 3: Deploy to Railway Cloud
  # NOTE: RAILWAY_TOKEN phải là PROJECT TOKEN
  # Lấy tại: Railway Dashboard → Project → Settings → Tokens → Create token
  # KHÔNG dùng Account token từ railway.com/account/tokens
  # ─────────────────────────────────────────
  deploy-to-railway:
    name: Auto Deploy to Railway Cloud
    needs: [build-and-test-backend, build-frontend]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Backend Jar Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        run: |
          echo "🚀 Deploying Backend (backend)..."
          cd backend && railway up --detach --service backend && cd ..
          
          echo "🚀 Deploying Frontend (frontend)..."
          cd frontend-web && railway up --detach --service frontend && cd ..
          
          echo "✅ Deploy commands triggered successfully!"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
