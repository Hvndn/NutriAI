server:
  port: 8000
  error:
    include-message: always

spring:
  application:
    name: nutri-ai-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutrition_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Cấu hình bảo mật và AI
jwt:
  secret: ${JWT_SECRET:supersecretjwtkey2026nutritionscanner}
  expiration: 86400000 # 24h bằng mili-giây

gemini:
  api:
    key: ${GEMINI_API_KEY:}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    com.nutriai.api: DEBUG
